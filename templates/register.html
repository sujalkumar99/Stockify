<!DOCTYPE html>
<html>
<head>
<title>Register - Stockify</title>
<style>
body{
    background:#0b1437;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}
.box{
    background:#1b2a5a;
    padding:30px;
    border-radius:15px;
    width:350px;
    text-align:center;
    color:white;
}
input{
    width:90%;
    padding:10px;
    margin:10px 0;
    border:none;
    border-radius:8px;
}
button{
    background:#00d26a;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
}
a{
    color:#00d26a;
}
</style>
</head>

<body>

<div class="box">
    <h1>🚀 Create Account</h1>

    <form method="POST">
        <input type="text" name="username" placeholder="Username">
        <input type="password" name="password" placeholder="Password">
        <button type="submit">Register</button>
    </form>

    <br>
    <a href="/login">Already have an account?</a>
</div>

</body>
</html>
